# Единственная точка конфигурации ДЗ 5. В src/ нет ни имени модели,
# ни learning rate, ни путей.
model:
  name: "Qwen/Qwen3-0.6B"
  device: "cpu"             # MPS backward на этом Mac оказался неустойчив
  dtype: "float32"
  cpu_threads: 4
  attn_implementation: "sdpa"
  enable_thinking: false    # как в ДЗ 4: шаблон должен совпадать с обучением

data:
  # Выход стадии tokenize из ДЗ 4. У студента — свой путь.
  train: "data/tokenized/train.pt"
  val: "data/tokenized/val.pt"

lora:
  r: 8
  alpha: 16                 # итоговый масштаб апдейта alpha / r = 2
  dropout: 0.05
  # Только проекции внимания и MLP. embed_tokens и lm_head — это 155 млн
  # параметров каждый; в modules_to_save они уезжают в адаптер целиком.
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

train:
  seed: 42
  # Фиксированная выборка из исходных тензоров ДЗ4 сокращает время на CPU.
  # null для обоих лимитов возвращает полный набор; исходные файлы не меняются.
  train_limit: 256
  val_limit: 32
  subset_seed: 42
  epochs: 1
  batch_size: 1
  grad_accum: 8             # эффективный батч = 8; безопасно при длине до 3456 токенов
  lr: 2.0e-4
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  loss_chunk_tokens: 128      # ограничение памяти lm_head на длинных ответах
  eval_every: 10            # шагов оптимизатора между замерами val loss
  # Наше ДЗ 4 допускает до 3456 токенов: оценка по одному примеру
  # ограничивает пик логитов и памяти на MacBook Air M2 16 ГБ.
  eval_batch_size: 1
  gradient_checkpointing: true
  gradient_checkpointing_min_tokens: 1024 # короткие входы быстрее без пересчёта
  max_steps: null           # null — по эпохам; число — обрезать (smoke-тесты)

# Эксперимент по слоям: второй прогон без адаптеров на первых N слоях.
variants:
  - name: "all_layers"
    freeze_first: 0
  - name: "freeze14"
    freeze_first: 14

compare:
  max_new_tokens: 192
  # Пять фиксированных промптов: одни и те же для базовой модели и адаптера.
  prompts:
    - "How do I get the last value of a pandas Series when its index labels are not consecutive?"
    - "How do I convert a pandas DataFrame to a list of dictionaries without including the row index?"
    - "Can I set a pandas DataFrame index name in the constructor? Show a short code example."
    - "Why does assigning to df.iloc[i, j] raise 'IndexError: iloc cannot enlarge its target object'?"
    - "What is the difference between pandas DataFrame.take() and iloc for positional row selection?"
  system: "You are a Python data-analysis assistant. Solve the user's pandas problem with a clear example."

paths:
  models: "models"
  metrics: "metrics"
  curves: "docs/curves.png"
  compare: "docs/compare.md"
